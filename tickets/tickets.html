<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUNA — Оформление билетов</title>
    <link rel="stylesheet" href="../css/tickets.css" />
  </head>
  <body class="tickets-page">
    <header class="header">
      <div class="logo">
        <svg width="24px" height="24px" viewBox="0 0 24 24" role="img">
          <title>Логотип кинотеатра Luna</title>
          <path
            d="M3.32031 11.6835C3.32031 16.6541 7.34975 20.6835 12.3203 20.6835C16.1075 20.6835 19.3483 18.3443 20.6768 15.032C19.6402 15.4486 18.5059 15.6834 17.3203 15.6834C12.3497 15.6834 8.32031 11.654 8.32031 6.68342C8.32031 5.50338 8.55165 4.36259 8.96453 3.32996C5.65605 4.66028 3.32031 7.89912 3.32031 11.6835Z"
            stroke="#ffffff"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>LUNA</span>
      </div>

      <div class="header-actions">
        <a href="../login/login.html" class="btn-login">Войти</a>
        <a href="../index.html" class="back-link">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            role="img"
            stroke="currentColor"
            stroke-width="2"
          >
            <title>Стрелка назад</title>
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Назад
        </a>
      </div>
    </header>

    <main class="container purchase-grid">
      <section class="selection-side">
        <div class="movie-main-info movie-card-bg">
          <h1 id="movie-title">Загрузка...</h1>
          <span class="age-badge" id="movie-age">--</span>
        </div>

        <div class="card selection-card-bg">
          <h2 class="card-title">
            <svg
              class="icons"
              width="27px"
              height="27px"
              viewBox="0 0 24 24"
              role="img"
              fill="none"
            >
              <title>Кресло</title>
              <path
                d="M17 21V16M7 21V16"
                stroke="#DDB8FF"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <path
                d="M15.4998 12H8.49977C6.84985 12 6.02489 12 5.51233 12.5858C5.22645 12.9125 5.10002 13.3503 5.0441 14.0008C4.96666 14.9018 4.92793 15.3523 5.22514 15.6762C5.52235 16 6.01482 16 6.99977 16H16.9998C17.9847 16 18.4772 16 18.7744 15.6762C19.0716 15.3523 19.0329 14.9018 18.9554 14.0008C18.8995 13.3503 18.7731 12.9125 18.4872 12.5858C17.9746 12 17.1497 12 15.4998 12Z"
                stroke="#DDB8FF"
                stroke-width="1.5"
              />
              <path
                d="M7 8C7 6.13077 7 5.19615 7.40192 4.5C7.66523 4.04394 8.04394 3.66523 8.5 3.40192C9.19615 3 10.1308 3 12 3C13.8692 3 14.8038 3 15.5 3.40192C15.9561 3.66523 16.3348 4.04394 16.5981 4.5C17 5.19615 17 6.13077 17 8V12H7V8Z"
                stroke="#DDB8FF"
                stroke-width="1.5"
              />
            </svg>
            Детали сеанса и выбор мест
          </h2>

          <div class="input-group">
            <label>ДАТА</label>
            <div class="chips" id="dates-container"></div>
          </div>

          <div class="input-group">
            <label>ВРЕМЯ</label>
            <div class="chips" id="times-container"></div>
          </div>

          <div class="hall-scheme">
            <div class="screen-line">ЭКРАН</div>
            <div class="seats-grid" id="seats-grid"></div>

            <div class="legend">
              <div class="legend-item">
                <span class="seat-icon free"></span> СВОБОДНО
              </div>
              <div class="legend-item">
                <span class="seat-icon selected"></span> ВЫБРАНО
              </div>
              <div class="legend-item">
                <span class="seat-icon busy"></span> ЗАНЯТО
              </div>
            </div>
          </div>

          <div class="price-display">
            <span class="price-label" id="price-per-ticket">0.00 BYN</span>
            <span class="price-label"> за билет</span>
          </div>
        </div>
      </section>

      <aside class="sidebar-side">
        <div class="card summary-card-bg">
          <h3>Итог заказа</h3>
          <div class="summary-line">
            <span id="summary-label">Выберите места</span>
            <span id="summary-price">0.00 BYN</span>
          </div>
          <div class="summary-total">
            <span>ОБЩАЯ СУММА</span>
            <span id="total-price">0.00 BYN</span>
          </div>
        </div>

        <div class="card payment-card-bg">
          <h3>
            <svg
              class="icons"
              width="27px"
              height="27px"
              viewBox="0 0 24 24"
              fill="none"
            >
              <title>Оплата</title>
              <rect
                x="3"
                y="6"
                width="18"
                height="13"
                rx="2"
                stroke="#DDB8FF"
                stroke-width="2"
              />
              <path
                d="M7 15H7.01"
                stroke="#DDB8FF"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M4 11H21"
                stroke="#DDB8FF"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Детали оплаты
          </h3>
          <form id="payment-form">
            <div class="field">
              <label>ИМЯ НА КАРТЕ</label>
              <input type="text" placeholder="IVAN IVANOV" required />
            </div>
            <div class="field">
              <label>НОМЕР КАРТЫ</label>
              <input type="text" placeholder="0000 0000 0000 0000" required />
            </div>
            <div class="field-row">
              <div class="field">
                <label>СРОК ДЕЙСТВИЯ</label>
                <input type="text" placeholder="ММ/ГГ" required />
              </div>
              <div class="field">
                <label>CVV</label>
                <input
                  type="password"
                  placeholder="***"
                  maxlength="3"
                  required
                />
              </div>
            </div>
            <button type="submit" class="pay-button">
              Оплатить <span id="btn-total">0.00 BYN</span> →
            </button>
          </form>
          <div class="secure-info">
            <svg
              class="icons"
              width="20px"
              height="20px"
              viewBox="0 0 24 24"
              role="img"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <title>Замок</title>
              <path
                d="M12 14.5V16.5M7 10.0288C7.47142 10 8.05259 10 8.8
                         10H15.2C15.9474 10 16.5286 10 17 10.0288M7 10.0288C6.41168
                          10.0647 5.99429 10.1455 5.63803 10.327C5.07354 10.6146 4.6146 11.0735 4.32698 11.638C4 12.2798 4 13.1198 4 14.8V16.2C4 17.8802 4 18.7202 4.32698 19.362C4.6146 19.9265 5.07354 20.3854 5.63803 20.673C6.27976 21 7.11984 21 8.8 21H15.2C16.8802 21 17.7202 21 18.362 20.673C18.9265 20.3854 19.3854 19.9265 19.673 19.362C20 18.7202 20 17.8802 20 16.2V14.8C20 13.1198 20 12.2798 19.673 11.638C19.3854 11.0735 18.9265 10.6146 18.362 10.327C18.0057 10.1455 17.5883 10.0647 17 10.0288M7 10.0288V8C7 5.23858 9.23858 3 12 3C14.7614 3 17 5.23858 17 8V10.0288"
                stroke="#DDB8FF"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Безопасный платеж
          </div>
        </div>
      </aside>
    </main>

    <div id="footer-place"></div>
    <script src="../components/common.js"></script>

    <script src="tickets.js"></script>
  </body>
</html>
